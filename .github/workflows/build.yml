name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Zoomy.exe
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Zoomy
          path: |
            Zoomy.exe
            uninstall.bat
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Zoomy.exe
            uninstall.bat
