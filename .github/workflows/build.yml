name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. v1.0.0). Leave empty to just build."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Zoomy.exe
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Zoomy
          path: |
            Zoomy.exe
            uninstall.bat
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Zoomy ${{ inputs.version || github.ref_name }}
          body: |
            Download **Zoomy.exe**, put it somewhere permanent, double-click it and choose **Yes**.
            Then right-click the desktop and pick **Zoom in on screen**, or press **Ctrl+Alt+Z**.
            Run **uninstall.bat** to remove it.
          files: |
            Zoomy.exe
            uninstall.bat
